services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        GIT_SHA: ${GIT_SHA:-dev}
    image: autoapply-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://autoapply:${DB_PASSWORD}@autoapply-db:5432/autoapply
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Resource caps so a runaway container can't starve co-tenant stacks on the
    # shared host. `docker compose up` (Compose v2) honors deploy.resources
    # limits/reservations on a single host — no Swarm required.
    deploy:
      resources:
        limits:
          memory: "1g"
          cpus: "1.0"
        reservations:
          memory: "256m"
          cpus: "0.25"

  worker:
    image: autoapply-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DATABASE_URL: postgresql://autoapply:${DB_PASSWORD}@autoapply-db:5432/autoapply
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      WORKER_CRON_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    entrypoint: ["/app/docker/worker-entrypoint.sh"]
    # Resource caps (Compose v2 applies deploy.resources on a single host).
    deploy:
      resources:
        limits:
          memory: "512m"
          cpus: "0.75"
        reservations:
          memory: "128m"
          cpus: "0.2"

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoapply
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: autoapply
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Unique alias on the shared `web` network: the bare `db` service-name alias
    # collides with other co-tenant stacks' postgres (slideprep-db also answers
    # to `db`), so the app/worker connect via `autoapply-db` to avoid resolving
    # to the wrong database and failing auth.
    networks:
      default:
        aliases:
          - autoapply-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoapply"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Resource caps (Compose v2 applies deploy.resources on a single host).
    deploy:
      resources:
        limits:
          memory: "1g"
          cpus: "1.0"
        reservations:
          memory: "256m"
          cpus: "0.25"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    # Resource caps (Compose v2 applies deploy.resources on a single host).
    # Memory limit sits above the 256mb --maxmemory so Redis keeps its dataset
    # plus overhead before the container cap bites.
    deploy:
      resources:
        limits:
          memory: "384m"
          cpus: "0.5"
        reservations:
          memory: "128m"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
      # Optional second site (portfolio co-tenant). Leave empty in .env.production
      # to disable the second site block in the Caddyfile.
      DOMAIN_PORTFOLIO: ${DOMAIN_PORTFOLIO:-}
      # Optional third site (slideprep co-tenant). Leave empty to disable.
      DOMAIN_SLIDEPREP: ${DOMAIN_SLIDEPREP:-}
    # Resource caps (Compose v2 applies deploy.resources on a single host).
    deploy:
      resources:
        limits:
          memory: "128m"
          cpus: "0.5"
        reservations:
          memory: "32m"

volumes:
  pgdata:
  redis:
  caddy_data:
  caddy_config:

# Co-tenant networking: this stack joins an external Docker network called
# `web` so its Caddy can proxy to other apps (e.g. /opt/portofolio) by
# container name. Create the network once on the host:
#   docker network create web
networks:
  default:
    name: web
    external: true
